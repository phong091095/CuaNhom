<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #10212A; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 1680px; height: 900px; box-sizing: border-box; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px;">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="height: 40px; display: flex; align-items: center; font-size: 18px; line-height: 26px; font-weight: 600; color: #10212A; white-space: nowrap;">D6 · Thêm cửa tiếp</span>
    <div style="width: 390px; height: 844px; position: relative; overflow: hidden;"><dc-import name="DoorDetail" overlay="add" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="height: 40px; display: flex; align-items: center; font-size: 18px; line-height: 26px; font-weight: 600; color: #10212A; white-space: nowrap;">D6 · Menu ⋯</span>
    <div style="width: 390px; height: 844px; position: relative; overflow: hidden;"><dc-import name="DoorDetail" overlay="menu" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="height: 40px; display: flex; align-items: center; font-size: 18px; line-height: 26px; font-weight: 600; color: #10212A; white-space: nowrap;">D6 · Xóa bộ cửa</span>
    <div style="width: 390px; height: 844px; position: relative; overflow: hidden;"><dc-import name="DoorDetail" overlay="delete" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="height: 40px; display: flex; align-items: center; font-size: 18px; line-height: 26px; font-weight: 600; color: #10212A; white-space: nowrap;">D5 · Bỏ thay đổi?</span>
    <div style="width: 390px; height: 844px; position: relative; overflow: hidden;"><dc-import name="DoorForm" dirty="{{ true }}" show-discard="{{ true }}" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1680,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
